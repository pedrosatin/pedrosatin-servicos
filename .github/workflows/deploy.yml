name: CI & Deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Types & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Inclui os testes do Worker (worker/src/*.test.ts).
      - name: Tests
        run: npm test

      - name: Build site & SSG prerender
        run: npm run build
        env:
          VITE_AUDIT_ENDPOINT: ${{ secrets.VITE_AUDIT_ENDPOINT || vars.VITE_AUDIT_ENDPOINT || 'https://servicos-api.pedrosatin.com' }}

  deploy:
    name: Deploy to Cloudflare Pages & Worker
    runs-on: ubuntu-latest
    needs: quality
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Build site & SSG prerender
        run: npm run build
        env:
          VITE_AUDIT_ENDPOINT: ${{ secrets.VITE_AUDIT_ENDPOINT || vars.VITE_AUDIT_ENDPOINT || 'https://servicos-api.pedrosatin.com' }}

      # O Worker sobe antes do Pages: o front novo chama /pagespeed, que só
      # existe no Worker novo. O Worker novo continua compatível com o front antigo.
      # Só o secret PSI_KEY. A chave antiga (VITE_PSI_KEY) foi publicada no
      # pacote do navegador e não pode voltar para o Worker. `--env=""` fixa o
      # ambiente de topo do wrangler.toml (produção), não o `dev`.
      - name: Sync PageSpeed key to Worker
        run: |
          if [ -z "$PSI_KEY" ]; then
            echo "Nenhum secret PSI_KEY no repositório; o Worker mantém o secret já cadastrado."
            exit 0
          fi
          printf '%s' "$PSI_KEY" | npm --prefix worker exec wrangler -- secret put PSI_KEY --config worker/wrangler.toml --env=""
        env:
          PSI_KEY: ${{ secrets.PSI_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '47584a1cc0e6303cda1f64c39ee59c73' }}

      - name: Deploy Worker
        run: npm --prefix worker exec wrangler -- deploy --config worker/wrangler.toml --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '47584a1cc0e6303cda1f64c39ee59c73' }}

      - name: Deploy Pages
        run: npm --prefix worker exec wrangler -- pages deploy dist --project-name=pedrosatin-servicos --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '47584a1cc0e6303cda1f64c39ee59c73' }}
