name: CI & Deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Types & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build site & SSG prerender
        run: npm run build
        env:
          VITE_AUDIT_ENDPOINT: ${{ secrets.VITE_AUDIT_ENDPOINT || vars.VITE_AUDIT_ENDPOINT || 'https://servicos-api.pedrosatin.com' }}
          VITE_PSI_KEY: ${{ secrets.VITE_PSI_KEY || vars.VITE_PSI_KEY }}

  deploy:
    name: Deploy to Cloudflare Pages & Worker
    runs-on: ubuntu-latest
    needs: quality
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Build site & SSG prerender
        run: npm run build
        env:
          VITE_AUDIT_ENDPOINT: ${{ secrets.VITE_AUDIT_ENDPOINT || vars.VITE_AUDIT_ENDPOINT || 'https://servicos-api.pedrosatin.com' }}
          VITE_PSI_KEY: ${{ secrets.VITE_PSI_KEY || vars.VITE_PSI_KEY }}

      - name: Deploy Pages
        run: npm --prefix worker exec wrangler -- pages deploy dist --project-name=pedrosatin-servicos --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '47584a1cc0e6303cda1f64c39ee59c73' }}

      - name: Deploy Worker
        run: npm --prefix worker exec wrangler -- deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '47584a1cc0e6303cda1f64c39ee59c73' }}
